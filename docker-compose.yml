services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # FalkorDB (Redis protocol)
      - "3000:3000"   # FalkorDB Browser: http://localhost:3000
    volumes:
      - falkordb-data:/data

  hub:
    build: .
    command: uvicorn kairos.hub.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
    ports:
      - "8000:8000"
    depends_on:
      - falkordb

volumes:
  falkordb-data:

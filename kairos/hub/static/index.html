<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAIROS · dashboard</title>
  <link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo" title="Kairos AI Agent (Click to activate pet avatar)" onclick="fetch('/api/launch_pet').catch(()=>{})">
        <img src="/static/kairos_logo.png?v=6" alt="Kairos" class="brand-logo-img">
      </div>
      <div class="brand-info">
        <span class="brand-title">Kairos</span>
      </div>
      <div class="brand-graph-pill" title="Connected FalkorDB Graph">
        <span class="pulse-dot"></span>
        <span id="graphName"></span>
      </div>
    </div>

    <div class="status">
      <!-- Live Taskbar Voice Agent Indicator -->
      <div class="taskbar-voice-pill" id="taskbarVoicePill" title="Voice Agent Status (Click to Talk / Toggle Voice Chat)">
        <span class="voice-wave-bars">
          <i></i><i></i><i></i><i></i>
        </span>
        <span class="voice-state-text" id="taskbarVoiceText">Voice: Standby</span>
      </div>

      <!-- Telemetry Stats: 146 nodes · 47 events · 41 actions -->
      <div id="counts" class="telemetry-stats"></div>

      <!-- Model Badge: mimo-v2.6-pro -->
      <span id="llmBadge" class="model-badge"></span>

      <!-- Devices Trigger with Hover Dropdown -->
      <div class="devices-dropdown-wrap" id="devicesDropdownWrap">
        <div class="devices-trigger" id="devicesTrigger" title="Connected Devices (Hover to inspect)">
          <div id="devices" class="devices-stack"></div>
          <span class="devices-chevron">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
        <div class="devices-dropdown-menu" id="devicesMenu" role="menu">
          <div class="dropdown-header">
            <div class="dropdown-title-group">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              <span>Devices</span>
            </div>
            <span class="dropdown-status-pill" id="devicesSimStatus">Online</span>
          </div>
          <div class="dropdown-device-list" id="devicesDropdownList">
            <!-- Dynamic device rows populated by app.js -->
          </div>
        </div>
      </div>

      <!-- Activate Button: ⚡ Activate F9 -->
      <button id="f9Btn" class="activate-btn" title="Activate Assistant & Review Updates (F9 or Ctrl+Shift+K)">
        <span class="btn-icon">⚡</span>
        <span class="btn-label">Activate</span>
        <span class="btn-kbd">F9</span>
      </button>

      <a href="/architecture" target="_blank" class="arch-link" title="Interactive Architecture & Presentation">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M3 10h18M5 10v11M19 10v11M9 10v11M14 10v11M12 3l9 7H3l9-7z"/></svg>
        <span>Architecture</span>
      </a>
    </div>
  </header>

  <!-- Mobile / narrow screen panel switcher -->
  <div class="mobile-nav" id="mobileNav">
    <button data-panel="chat" class="on">💬 Chat</button>
    <button data-panel="graph">🕸️ Memory Graph</button>
    <button data-panel="side">⚡ Activity & Tools</button>
  </div>

  <main class="grid" id="panelsContainer">
    <!-- chat -->
    <section class="panel chat" id="panelChat">
      <div class="panel-head">
        <div class="head-left">
          <h2>Talk to KAIROS</h2>
          <div class="seg" id="deviceSeg">
            <button data-kind="pc" class="on">💻 PC</button>
            <button data-kind="phone">📱 Phone</button>
          </div>
        </div>
        <div class="panel-actions">
          <button class="panel-btn" id="btnCollapseChat" title="Collapse Chat Panel (◀)">◀</button>
        </div>
      </div>
      <div class="collapsed-strip" id="stripChat" title="Click to expand Chat">
        <span>💬 TALK TO KAIROS</span>
        <button class="expand-btn">▶</button>
      </div>
      <div class="panel-content">
        <div id="messages" class="messages"></div>
        
        <!-- Draggable Horizontal Splitter for Chat Display vs Suggestions -->
        <div class="chips-resizer" id="resizerChatChips" title="Drag vertically to resize Chat display area">
          <div class="chips-resizer-line"></div>
          <div class="chips-resizer-btn" id="btnToggleChips" title="Click to collapse / expand suggestions">
            <span class="resizer-icon" id="chipsToggleIcon">▼</span>
            <span class="resizer-text">Quick Prompts</span>
          </div>
        </div>

        <div class="chips-wrap" id="chipsWrap">
          <div class="chips" id="chips"></div>
        </div>

        <form id="chatForm" class="chat-input">
          <button type="button" id="micBtn" class="mic idle" title="Talk (Ctrl+M)">🎤</button>
          <input id="chatText" autocomplete="off" placeholder="e.g. tell me on my phone when the download finishes">
          <button type="submit">Send</button>
        </form>
        <div class="voice-bar">
          <label class="small"><input type="checkbox" id="voiceMode"> Voice chat (keeps listening)</label>
          <label class="small"><input type="checkbox" id="voiceMute"> Mute replies</label>
          <span class="level"><i id="micLevel"></i></span>
          <span id="voiceHint" class="muted small"></span>
        </div>
      </div>
    </section>

    <!-- Resizer between Chat & Graph -->
    <div class="panel-resizer" id="resizerChatGraph" data-resize="chat" title="Drag to resize Chat and Graph panels">
      <div class="resizer-bar"></div>
    </div>

    <!-- graph -->
    <section class="panel graph" id="panelGraph">
      <div class="panel-head">
        <div class="head-left">
          <h2>Memory graph</h2>
          <div class="controls">
            <select id="graphWindow">
              <option value="60">last hour</option>
              <option value="1440" selected>last 24 h</option>
              <option value="10080">last 7 days</option>
              <option value="43200">last 30 days</option>
            </select>
            <label class="small"><input type="checkbox" id="graphAuto" checked> live</label>
            <button id="graphRefresh" class="ghost" title="Refresh Graph">↻</button>
            <button id="graphCenter" class="ghost" title="Center & Fit Graph In View">🎯 Fit</button>
          </div>
        </div>
        <div class="panel-actions">
          <button class="panel-btn" id="btnMaxGraph" title="Maximize / Restore Graph Canvas">⛶</button>
        </div>
      </div>
      <div class="graph-wrap" id="graphWrap">
        <svg id="graphSvg"></svg>
        <div id="legend" class="legend"></div>
        <div id="nodeInfo" class="node-info hidden"></div>
      </div>
    </section>

    <!-- Resizer between Graph & Side -->
    <div class="panel-resizer" id="resizerGraphSide" data-resize="side" title="Drag to resize Graph and Activity panels">
      <div class="resizer-bar"></div>
    </div>

    <!-- side tabs -->
    <section class="panel side" id="panelSide">
      <div class="panel-head">
        <div class="tabs" id="tabs">
          <button data-tab="timeline" class="on">Timeline</button>
          <button data-tab="actions">Actions</button>
          <button data-tab="tasks">Tasks</button>
          <button data-tab="watchers">Watchers</button>
          <button data-tab="memory">Memory</button>
        </div>
        <div class="panel-actions">
          <button class="panel-btn" id="btnCollapseSide" title="Collapse Activity Panel (▶)">▶</button>
        </div>
      </div>
      <div class="collapsed-strip" id="stripSide" title="Click to expand Activity Panel">
        <button class="expand-btn">◀</button>
        <span>⚡ ACTIVITY &amp; TOOLS</span>
      </div>
      <div class="panel-content">
        <div class="tab-body">
          <div id="tab-timeline" class="tab on"></div>
          <div id="tab-actions" class="tab"></div>
          <div id="tab-tasks" class="tab"></div>
          <div id="tab-watchers" class="tab"></div>
          <div id="tab-memory" class="tab"></div>
        </div>
        <div class="sim">
          <span class="muted small">Simulator</span>
          <button data-sim="morning">▶ Morning (email + Uber)</button>
          <button data-sim="download">▶ Download</button>
          <button data-sim="commute">▶ Commute</button>
          <button data-sim="injection">▶ Injection email</button>
          <button id="consolidate" class="ghost">Detect habits</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toasts" class="toasts"></div>
  <div id="modal" class="modal hidden"><div class="modal-card"><button class="close" id="modalClose">×</button><div id="modalBody"></div></div></div>
  <script src="/static/app.js?v=7"></script>
  <script src="/static/voice.js?v=7"></script>
</body>
</html>

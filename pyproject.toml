[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos"
version = "0.1.0"
description = "Voice-first, cross-device personal agent whose memory is a FalkorDB graph"
requires-python = ">=3.10"
dependencies = [
  "falkordb>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2",
  "pyyaml>=6",
  "httpx>=0.27",
  "websockets>=12",
  "python-dotenv>=1",
  "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
pc = ["watchdog>=4", "win11toast; platform_system == 'Windows'", "pyttsx3", "psutil"]
web = ["playwright"]
all = ["kairos[pc,voice,embeddings,mcp,web]"]
voice = ["faster-whisper", "sounddevice", "numpy", "keyboard", "pyttsx3", "openwakeword"]
pet = ["sounddevice", "numpy"]  # mic for the desktop pet (speech-to-text itself runs on the hub: [voice])
embeddings = ["sentence-transformers"]
mcp = ["mcp"]
dev = ["pytest>=8"]

[project.scripts]
kairos = "kairos.cli:main"

[tool.setuptools.packages.find]
include = ["kairos*", "agents*"]

[tool.setuptools.package-data]
kairos = ["hub/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

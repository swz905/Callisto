# Clean baseline persona for Shubhashish. No dummy demo data.
user:
  id: shubhashish
  name: Shubhashish
  tz: Asia/Kolkata

devices:
  - {id: phone-shubhashish, kind: phone, name: "Shubhashish's Phone"}
  - {id: pc-main, kind: pc, name: "Shubhashish's PC"}
  - {id: telegram-shubhashish, kind: chat, name: "Telegram"}

people: []

places: []

facts: []

notes: []

# Capability risk tiers: 0 read/notify, 1 low-risk write, 2 needs care, 3 always confirm.
capabilities:
  - {name: read, risk: 0, description: "Read the graph"}
  - {name: notify, risk: 0, description: "Show an alert or speak"}
  - {name: watcher.create, risk: 1, description: "Create or cancel watchers"}
  - {name: memory.write, risk: 1, description: "Remember a fact, note or task"}
  - {name: memory.forget, risk: 2, description: "Archive memories"}
  - {name: memory.share, risk: 1, description: "Share with the family graph"}
  - {name: file.open, risk: 1, description: "Open a local file"}
  - {name: link.open, risk: 1, description: "Open a link someone sent"}
  - {name: net.download, risk: 1, description: "Download a file"}
  - {name: file.transfer, risk: 1, description: "Send a file to another device"}
  - {name: clipboard, risk: 1, description: "Read/copy the clipboard between devices"}
  - {name: shell.read, risk: 1, description: "Run an allowlisted read-only command"}
  - {name: shell.exec, risk: 3, description: "Run any shell command"}
  - {name: file.delete, risk: 3, description: "Delete files"}
  - {name: net.search, risk: 0, description: "Search the web (read-only)"}
  - {name: net.read, risk: 1, description: "Read a web page we already know about (search result, link you got)"}
  - {name: net.read_unknown, risk: 2, description: "Read a web page from an address nobody gave us"}

# Device -> capability -> mode (auto / confirm / deny). Missing edge = deny.
permissions:
  pc-main:
    net.search: auto
    net.read: auto
    net.read_unknown: confirm
    read: auto
    notify: auto
    watcher.create: auto
    memory.write: auto
    memory.forget: confirm
    memory.share: auto
    file.open: auto
    link.open: auto
    net.download: auto
    file.transfer: auto
    clipboard: auto
    shell.read: auto
    shell.exec: confirm
    file.delete: confirm
  phone-shubhashish:
    net.search: auto
    net.read: auto
    net.read_unknown: confirm
    read: auto
    notify: auto
    watcher.create: auto
    memory.write: auto
    memory.forget: confirm
    memory.share: auto
    file.open: auto
    link.open: auto
    net.download: confirm
    file.transfer: auto
    clipboard: auto
    shell.read: confirm
  telegram-shubhashish:
    net.search: auto
    net.read: auto
    net.read_unknown: confirm
    read: auto
    notify: auto
    watcher.create: auto
    memory.write: auto
    memory.forget: confirm
    memory.share: confirm
    file.open: confirm
    link.open: confirm
    net.download: confirm
    file.transfer: confirm
    clipboard: confirm
    shell.read: confirm
    shell.exec: confirm
    file.delete: confirm
